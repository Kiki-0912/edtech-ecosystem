[build]
  base = "apps/app"
  command = "flutter build web --release --dart-define=API_BASE_URL=${API_BASE_URL:-https://edtech-ecosystem-api.netlify.app} --dart-define=OFFLINE_MODE=${OFFLINE_MODE:-false} && node scripts/bust_cache.js"
  publish = "build/web"

[build.environment]
  FLUTTER_VERSION = "3.50.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Flutter asset file names are not content-hashed, so they must revalidate.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
