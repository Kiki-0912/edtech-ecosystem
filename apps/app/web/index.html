<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build --base-href`; must start and end with "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EdTech — courses, attendance, schedules, class chat and process-based integrity insights for students, teachers and administrators.">
  <meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C0A09" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EdTech">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EdTech</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Branded splash shown until Flutter paints its first frame. */
    html, body { margin: 0; height: 100%; background: #FAFAF9; }
    @media (prefers-color-scheme: dark) { html, body { background: #0C0A09; } }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; transition: opacity .25s ease;
    }
    #splash img {
      width: 72px; height: 72px; border-radius: 16px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(.92); opacity: .75; } }
    @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading EdTech" role="progressbar">
    <img src="icons/Icon-192.png" alt="">
  </div>
  <script>
    // Remove the splash once Flutter has rendered.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
