# Deploys the API as a single Netlify Function (netlify/functions/api.mts).
# Monorepo site: Base directory = (repo root), Package directory = apps/api.
# Paths below are relative to the repo root; deploy with
#   netlify deploy --build --prod --filter @edtech/api
[build]
  # Nothing static to build; the publish dir only needs to exist.
  command = "mkdir -p apps/api/netlify/public"
  publish = "apps/api/netlify/public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "apps/api/netlify/functions"
  node_bundler = "esbuild"
  # Load these from node_modules instead of bundling them (CommonJS deps with
  # dynamic requires bundle poorly into an ESM function).
  external_node_modules = ["fastify", "@fastify/cors", "pg"]
